<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدمات | Blox Shop</title>
    <link rel="stylesheet" href="css/swiper-bundle.min.css" />
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/services.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="shortcut icon" href="./images/logo.jpg" type="image/x-icon">
</head>
<body>
    <header>
        <div class="logo"><img src="images/logo.jpg" alt="Logo"></div>
        <button class="mobile-menu-btn" onclick="toggleMobileMenu()"><i class="fas fa-bars"></i></button>
        <div class="menu-overlay" onclick="toggleMobileMenu()"></div>
        <div class="sidebar-content">
            <button class="close-sidebar-btn" onclick="toggleMobileMenu()"><i class="fas fa-times"></i></button>
            <nav><ul></ul></nav>
            <div class="header-actions">
                <button class="theme-toggle">☀️</button>
                <div id="auth-container"></div>
            </div>
        </div>
    </header>


        <!-- کانتینر اسلایدرهای داینامیک -->
        <div id="service-sliders-container"></div>
    </main>

    <!-- فوتر -->
    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-logo">
                <img src="images/logo.jpg" alt="Blox Shop">
                <h3>Blox Shop</h3>
                <p>مرجع تخصصی خرید آیتم‌های Blox Fruits</p>
            </div>

            <div class="made-by">
                <i class="fas fa-code"></i>
                Made with <i class="fas fa-heart heart"></i> by
                <strong>Behdad Naderi</strong>
            </div>

           <p class="footer-copy">© <span class="footer-year-text">۱۴۰۴</span> Blox Shop - تمام حقوق محفوظ است</p>
        </div>
    </footer>

    <script src="js/swiper-bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/services.js"></script>
</body>
</html>
