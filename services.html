<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدمات | Blox Shop</title>
    <link rel="stylesheet" href="css/swiper-bundle.min.css" />
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/services.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="shortcut icon" href="./images/logo.jpg" type="image/x-icon">
</head>
<body>
    <header>
        <div class="logo"><img src="images/logo.jpg" alt="Logo"></div>
        <button class="mobile-menu-btn" onclick="toggleMobileMenu()"><i class="fas fa-bars"></i></button>
        <div class="menu-overlay" onclick="toggleMobileMenu()"></div>
        <div class="sidebar-content">
            <button class="close-sidebar-btn" onclick="toggleMobileMenu()"><i class="fas fa-times"></i></button>
            <nav><ul></ul></nav>
            <div class="header-actions">
                <button class="theme-toggle">☀️</button>
                <div id="auth-container"></div>
            </div>
        </div>
    </header>

    <main class="container">
        <h2 class="page-title">خدمات تخصصی Blox Fruits</h2>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 40px;">تمام خدمات توسط پلیرهای حرفه‌ای و با بالاترین امنیت انجام می‌شود.</p>

              <!-- اسلایدر توضیحات خدمات -->
        <div class="swiper mySwiper" id="services-desc-slider" style="padding-bottom: 40px;">
            <div class="swiper-wrapper" id="services-desc-wrapper"></div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
        </div>

        <h2 class="page-title" style="margin-top: 60px;">خرید خدمات (Level Up)</h2>
        
        <!-- بخش خرید خدمات (تبدیل به اسلایدر) -->
        <div class="swiper mySwiper" id="services-slider" style="padding-bottom: 50px;">
            <div class="swiper-wrapper"></div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
        </div>
    </main>

    <script src="js/swiper-bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/services.js"></script>
</body>
</html>
