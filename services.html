<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدمات | Blox Shop</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/services.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
       <header>
        <div class="logo"><img src="images/logo.jpg" alt="Logo"></div>
        
        <!-- دکمه منوی موبایل -->
        <button class="mobile-menu-btn" onclick="toggleMobileMenu()">
            <i class="fas fa-bars"></i>
        </button>

        <!-- لایه تاریک پشت منو (برای بستن منو با کلیک بیرون از آن) -->
        <div class="menu-overlay" onclick="toggleMobileMenu()"></div>
        
        <!-- سایدبار (منوی کناری) -->
        <div class="sidebar-content">
            <!-- دکمه بستن منو (داخل سایدبار) -->
            <button class="close-sidebar-btn" onclick="toggleMobileMenu()">
                <i class="fas fa-times"></i>
            </button>

            <nav>
                <ul></ul> <!-- لینک‌ها توسط JS ساخته می‌شوند -->
            </nav>
            
            <div class="header-actions">
                <button class="theme-toggle">☀️</button>
                <div id="auth-container"></div>
            </div>
        </div>
    </header>
    <main class="container">
        <h2 class="page-title">خدمات تخصصی Blox Fruits</h2>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 40px;">تمام خدمات توسط پلیرهای حرفه‌ای و با بالاترین امنیت انجام می‌شود.</p>

        <!-- توضیحات خدمات -->
        <div class="services-grid" id="services-desc-grid"></div>

        <h2 class="page-title" style="margin-top: 60px;">خرید خدمات (Level Up)</h2>
        
        <!-- خرید خدمات -->
        <div class="grid" id="services-grid"></div>
    </main>

    <script src="js/app.js"></script>
    <script src="js/services.js"></script>
</body>
</html>
