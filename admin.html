<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل ادمین | Blox Shop</title>
    <link rel="stylesheet" href="css/swiper-bundle.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
        <header>
        <div class="logo"><img src="images/logo.jpg" alt="Logo"></div>
        
        <!-- دکمه منوی موبایل -->
        <button class="mobile-menu-btn" onclick="toggleMobileMenu()">
            <i class="fas fa-bars"></i>
        </button>

        <!-- لایه تاریک پشت منو (برای بستن منو با کلیک بیرون از آن) -->
        <div class="menu-overlay" onclick="toggleMobileMenu()"></div>
        
        <!-- سایدبار (منوی کناری) -->
        <div class="sidebar-content">
            <!-- دکمه بستن منو (داخل سایدبار) -->
            <button class="close-sidebar-btn" onclick="toggleMobileMenu()">
                <i class="fas fa-times"></i>
            </button>

            <nav>
                <ul></ul> <!-- لینک‌ها توسط JS ساخته می‌شوند -->
            </nav>
            
            <div class="header-actions">
                <button class="theme-toggle">☀️</button>
                <div id="auth-container"></div>
            </div>
        </div>
    </header>

    <main class="container">
        <h1 class="page-title" style="margin-top: 30px;">داشبورد مدیریت</h1>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 40px;">در این پنل می‌توانید تمام بخش‌های فروشگاه را مدیریت کنید.</p>

        <!-- بخش بالایی: فرم‌ها و تنظیمات (۲ ستونه) -->
        <div class="admin-dashboard">
            
            <!-- ستون راست -->
            <div class="admin-column">
                <!-- تنظیمات آمار -->
                <div class="admin-card" style="border-top-color: var(--primary-orange);">
                    <h3><i class="fas fa-chart-line" style="color:var(--primary-orange);"></i> تنظیمات آمار</h3>
                    <input type="text" id="set-orders" placeholder="تعداد خرید موفق (مثلا +۳,۰۰۰)">
                    <input type="text" id="set-rating" placeholder="امتیاز رضایت (مثلا ۵ / ۵)">
                    <button onclick="saveStats()" class="btn" style="background:var(--primary-orange); width:100%;">ذخیره آمار</button>
                </div>

                <!-- مدیریت دسته‌بندی‌ها -->
                <div class="admin-card" style="border-top-color: var(--primary-blue);">
                    <h3><i class="fas fa-layer-group" style="color:var(--primary-blue);"></i> مدیریت دسته‌بندی‌ها</h3>
                    <div style="display:flex; gap:10px;">
                        <input type="text" id="newCatName" placeholder="نام انگلیسی (مثلا Swords)" style="margin:0;">
                        <input type="color" id="newCatColor" value="#ff3333" style="width:60px; margin:0; padding:5px;">
                    </div>
                    <button onclick="addCategory()" class="btn" style="background:var(--primary-blue); width:100%; margin-top:10px;">افزودن دسته‌بندی</button>
                    <div id="admin-categories-list" style="max-height: 200px; overflow-y: auto; margin-top:15px;"></div>
                </div>
            </div>

            <!-- ستون چپ -->
            <div class="admin-column">
                <!-- فرم آیتم‌ها -->
                <div class="admin-card" id="form-card" style="border-top-color: var(--primary-blue);">
                    <h3 id="form-title"><i class="fas fa-apple-alt" style="color:var(--primary-blue);"></i> افزودن آیتم جدید</h3>
                    <input type="hidden" id="edit-item-id">
                    <input type="text" id="itemName" placeholder="نام آیتم (مثلا Dragon)">
                    <input type="text" id="itemPrice" placeholder="قیمت (مثلا 250,000)">
                    <select id="itemCategory"></select>
                    <div class="image-upload-group">
                        <label for="itemImgFile" class="upload-btn"><i class="fas fa-cloud-upload-alt"></i> انتخاب عکس از سیستم</label>
                        <input type="file" id="itemImgFile" accept="image/*" style="display: none;">
                        <img id="imagePreview" src="" alt="پیش‌نمایش عکس" style="display: none;">
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button onclick="saveItem()" class="btn" style="background:var(--primary-blue); flex:1;">ذخیره آیتم</button>
                        <button onclick="resetForm()" class="btn" style="background:var(--border-color); flex:1; display:none;" id="cancel-btn">لغو</button>
                    </div>
                </div>

                <!-- فرم خدمات -->
                <div class="admin-card" id="service-form-card" style="border-top-color: var(--primary-orange);">
                    <h3 id="service-form-title"><i class="fas fa-tools" style="color:var(--primary-orange);"></i> افزودن خدمت جدید</h3>
                    <input type="hidden" id="edit-service-id">
                    <input type="text" id="serviceTitle" placeholder="عنوان خدمت (مثلا لول اپ)">
                    <textarea id="serviceDesc" placeholder="توضیحات خدمت..." rows="2" style="width:100%; padding:12px; border-radius:8px; background:var(--bg-color); border:1px solid var(--border-color); color:var(--text-color); font-family:inherit; resize:vertical; margin-bottom:10px;"></textarea>
                    <input type="text" id="serviceIcon" placeholder="آیکون (اختیاری - مثلا fas fa-level-up-alt)">
                    
                    <div class="image-upload-group" style="margin-top: 10px;">
                        <label for="serviceImgFile" class="upload-btn" style="background: rgba(255,140,0,0.1); border-color: var(--primary-orange); color: var(--primary-orange);">
                            <i class="fas fa-cloud-upload-alt"></i> انتخاب عکس (اختیاری)
                        </label>
                        <input type="file" id="serviceImgFile" accept="image/*" style="display: none;">
                        <img id="serviceImgPreview" src="" alt="پیش‌نمایش" style="display: none; max-width: 100%; max-height: 120px; border-radius: 8px; border: 1px solid var(--primary-orange); object-fit: contain;">
                    </div>

                    <div style="display: flex; gap: 10px; margin-top:10px;">
                        <button onclick="saveService()" class="btn" style="background:var(--primary-orange); flex:1;">ذخیره خدمت</button>
                        <button onclick="resetServiceForm()" class="btn" style="background:var(--border-color); flex:1; display:none;" id="cancel-service-btn">لغو</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- بخش وسط: لیست خدمات (تمام عرض) -->
        <div class="admin-card" style="margin-top: 30px; border-top-color: var(--border-color);">
            <h3><i class="fas fa-list" style="color:var(--text-color);"></i> لیست خدمات ثبت شده</h3>
            <div id="admin-services-list" style="max-height: 400px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px;"></div>
        </div>

        <!-- بخش پایین: اسلایدرها (تمام عرض) -->
        <h2 class="page-title" style="margin-top: 60px;">مدیریت اسلایدرها</h2>
        <div id="admin-sliders-container"></div>
    </main>

    <script src="js/swiper-bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
