<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل ادمین | Blox Shop</title>
    <link rel="stylesheet" href="css/swiper-bundle.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
        <header>
        <div class="logo"><img src="images/logo.jpg" alt="Logo"></div>
        
        <!-- دکمه منوی موبایل -->
        <button class="mobile-menu-btn" onclick="toggleMobileMenu()">
            <i class="fas fa-bars"></i>
        </button>

        <nav>
            <ul>
                <!-- لینک active رو بر اساس صفحه تنظیم کنید (مثلا در items.html روی آیتم ها باشه) -->
                <li><a href="index.html">خانه</a></li>
                <li><a href="items.html">آیتم‌ها</a></li>
                <li><a href="services.html">خدمات</a></li>
                <li><a href="contact.html">تماس</a></li>
            </ul>
        </nav>
        
        <div class="header-actions">
            <button class="theme-toggle">☀️</button>
            <div id="auth-container"><a href="login.html" class="btn">ورود / ثبت‌نام</a></div>
        </div>
    </header>

    <main class="container">
        
        <!-- بخش هیرو (کپی شده از صفحه اصلی) -->
        <section class="hero-layout">
            <div class="hero-text">
                <h1>مدیریت <br><span class="brand-glow">Blox Shop</span></h1>
                <p>در این پنل می‌توانید آیتم‌های فروشگاه را مدیریت کنید، آیتم جدید اضافه کنید یا آیتم‌های قبلی را ویرایش و حذف کنید.</p>
            </div>
       <!-- ستون چپ: تنظیمات آمار و فرم آیتم ها -->
<div class="hero-features">
    
    <!-- تنظیمات آمار سایت -->
    <div class="admin-form-card" style="border-color: var(--primary-orange);">
        <h3 style="color:var(--primary-orange); margin-bottom:15px;">تنظیمات آمار سایت</h3>
        <input type="text" id="set-orders" placeholder="تعداد خرید موفق (مثلا +۳,۰۰۰)">
        <input type="text" id="set-rating" placeholder="امتیاز رضایت (مثلا ۵ / ۵)">
        <button onclick="saveStats()" class="btn" style="background:var(--primary-orange); width:100%;">ذخیره آمار</button>
    </div>

    <!-- فرم افزودن / ویرایش آیتم (همون کد قبلی) -->
    <div class="admin-form-card" id="form-card" style="margin-top: 20px;">
        <h3 id="form-title" style="color:var(--primary-blue); margin-bottom:15px;">افزودن آیتم جدید</h3>
        <input type="hidden" id="edit-item-id">
        <input type="text" id="itemName" placeholder="نام آیتم (مثلا Dragon)">
        <input type="text" id="itemPrice" placeholder="قیمت (مثلا 250,000)">
        <select id="itemCategory">
            <option value="Mythical">Mythical</option>
            <option value="Legendary">Legendary</option>
            <option value="Rare">Rare</option>
            <option value="Uncommon">Uncommon</option>
            <option value="Common">Common</option>
            <option value="Service">Level Up (Service)</option>
        </select>
       <div class="image-upload-group">
    <label for="itemImgFile" class="upload-btn">
        <i class="fas fa-cloud-upload-alt"></i> انتخاب عکس از سیستم
    </label>
    <input type="file" id="itemImgFile" accept="image/*" style="display: none;">
    <img id="imagePreview" src="" alt="پیش‌نمایش عکس" style="display: none;">
</div>
        <div style="display: flex; gap: 10px;">
            <button onclick="saveItem()" class="btn" style="background:var(--primary-blue); flex:1;">ذخیره آیتم</button>
            <button onclick="resetForm()" class="btn" style="background:var(--border-color); flex:1; display:none;" id="cancel-btn">لغو</button>
        </div>
    </div>
</div>
        </section>

        <!-- بخش اسلایدرها (با دکمه‌های مدیریت) -->
        <h2 class="page-title" style="margin-top: 60px;">آیتم‌های فروشگاه</h2>

        <div class="slider-section">
            <h3 class="text-mythical">Mythical</h3>
            <div class="swiper mySwiper" id="swiper-Mythical">
                <div class="swiper-wrapper"></div>
                <div class="swiper-button-next"></div>
                <div class="swiper-button-prev"></div>
            </div>
        </div>

        <div class="slider-section">
            <h3 class="text-legendary">Legendary</h3>
            <div class="swiper mySwiper" id="swiper-Legendary">
                <div class="swiper-wrapper"></div>
                <div class="swiper-button-next"></div>
                <div class="swiper-button-prev"></div>
            </div>
        </div>

        <div class="slider-section">
            <h3 class="text-rare">Rare</h3>
            <div class="swiper mySwiper" id="swiper-Rare">
                <div class="swiper-wrapper"></div>
                <div class="swiper-button-next"></div>
                <div class="swiper-button-prev"></div>
            </div>
        </div>

        <div class="slider-section">
            <h3 class="text-uncommon">Uncommon</h3>
            <div class="swiper mySwiper" id="swiper-Uncommon">
                <div class="swiper-wrapper"></div>
                <div class="swiper-button-next"></div>
                <div class="swiper-button-prev"></div>
            </div>
        </div>

        <div class="slider-section">
            <h3 class="text-common">Common</h3>
            <div class="swiper mySwiper" id="swiper-Common">
                <div class="swiper-wrapper"></div>
                <div class="swiper-button-next"></div>
                <div class="swiper-button-prev"></div>
            </div>
        </div>

    </main>

    <script src="js/swiper-bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
