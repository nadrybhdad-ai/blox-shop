<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آیتم‌ها | Blox Shop</title>
    
    <!-- لینک آیکون‌ها (این خط جا افتاده بود) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/items.css">
</head>
<body>
        <header>
        <div class="logo"><img src="images/logo.jpg" alt="Logo"></div>
        
        <!-- دکمه منوی موبایل -->
        <button class="mobile-menu-btn" onclick="toggleMobileMenu()">
            <i class="fas fa-bars"></i>
        </button>

        <!-- لایه تاریک پشت منو -->
        <div class="menu-overlay" onclick="toggleMobileMenu()"></div>
        
        <!-- سایدبار (منوی کناری) -->
        <div class="sidebar-content">
            <button class="close-sidebar-btn" onclick="toggleMobileMenu()">
                <i class="fas fa-times"></i>
            </button>

            <nav>
                <ul></ul> <!-- لینک‌ها توسط JS ساخته می‌شوند -->
            </nav>
            
            <div class="header-actions">
                <button class="theme-toggle">☀️</button>
                <div id="auth-container"></div>
            </div>
        </div>
    </header>

    <main class="container">
        <h2 class="page-title">فروشگاه میوه‌ها</h2>
        
        <!-- فیلترها به صورت داینامیک ساخته می‌شوند -->
        <div class="filters" id="filters-container"></div>

        <div class="grid" id="items-grid"></div>
    </main>

    <script src="js/app.js"></script>
    <script src="js/items.js"></script>
</body>
</html>
