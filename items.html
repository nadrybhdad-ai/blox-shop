<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آیتم‌ها | Blox Shop</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/items.css">
</head>
<body>
        <header>
        <div class="logo"><img src="images/logo.jpg" alt="Logo"></div>
        
        <!-- دکمه منوی موبایل -->
        <button class="mobile-menu-btn" onclick="toggleMobileMenu()">
            <i class="fas fa-bars"></i>
        </button>

        <nav>
            <ul>
                <!-- لینک active رو بر اساس صفحه تنظیم کنید (مثلا در items.html روی آیتم ها باشه) -->
                <li><a href="index.html">خانه</a></li>
                <li><a href="items.html">آیتم‌ها</a></li>
                <li><a href="services.html">خدمات</a></li>
                <li><a href="contact.html">تماس</a></li>
            </ul>
        </nav>
        
        <div class="header-actions">
            <button class="theme-toggle">☀️</button>
            <div id="auth-container"><a href="login.html" class="btn">ورود / ثبت‌نام</a></div>
        </div>
    </header>

    <main class="container">
        <h2 class="page-title">فروشگاه میوه‌ها</h2>
        
        <div class="filters">
            <button class="filter-btn active" data-filter="all">همه</button>
            <button class="filter-btn mythical" data-filter="Mythical">Mythical</button>
            <button class="filter-btn legendary" data-filter="Legendary">Legendary</button>
            <button class="filter-btn rare" data-filter="Rare">Rare</button>
            <button class="filter-btn uncommon" data-filter="Uncommon">Uncommon</button>
            <button class="filter-btn common" data-filter="Common">Common</button>
            <button class="filter-btn service" data-filter="Service">Level Up</button>
        </div>

        <div class="grid" id="items-grid">
            <!-- جاوااسکریپت آیتم‌ها را اینجا رندر می‌کند -->
        </div>
    </main>

    <script src="js/app.js"></script>
    <script src="js/items.js"></script>
</body>
</html>
